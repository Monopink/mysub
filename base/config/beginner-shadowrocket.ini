[custom]
; Beginner profile with one unified proxy group.
; All non-LAN traffic uses the single manually selected proxy group.
ruleset=DIRECT,[]GEOIP,LAN,no-resolve
ruleset=节点选择,[]FINAL

enable_rule_generator=true
overwrite_original_rules=true
custom_proxy_group=节点选择`select`.*

surge_rule_base=base/beginner-shadowrocket.conf

add_emoji=false
remove_old_emoji=false
